
# GitHub Actions + JFrog CLI — npm 构建 / 上传 / Build Info / Xray 扫描
# 仓库: https://github.com/gyzong1/npm-example
#
# 仓库 Secrets / Variables:
#   vars.JF_URL              JFrog Platform URL，如 https://xxx.com
#   secrets.JF_ACCESS_TOKEN  具备 Deploy / Build Info / Xray Scan 权限的 Access Token
#
# Artifactory 仓库名可按环境修改；建议使用 npm virtual（含 remote + local，并设置 Default Deployment Repository）

name: npm Build & Publish to Artifactory

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  JFROG_CLI_BUILD_NAME: guoyz-github-npm-example
  JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}
  # 解析 / 部署仓库（通常为同一个 npm virtual）
  NPM_REPO_RESOLVE: guoyz-github-npm-virtual
  NPM_REPO_DEPLOY: guoyz-github-npm-virtual

jobs:
  build-publish-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        with:
          # 由本 workflow 显式执行 bce / bag / bp，关闭 action 自动发布，避免重复 Build Info
          disable-auto-build-publish: true
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}

      - name: Ping Artifactory
        run: jf rt ping

      # 1) 配置 npm 解析 / 部署仓库
      - name: Configure npm repositories
        run: |
          jf npm-config \
            --repo-resolve="${NPM_REPO_RESOLVE}" \
            --repo-deploy="${NPM_REPO_DEPLOY}"

      # 2) 安装依赖（从 Artifactory 拉取，并记入 Build Info）
      - name: Install dependencies
        run: |
          jf npm install \
            --build-name="${JFROG_CLI_BUILD_NAME}" \
            --build-number="${JFROG_CLI_BUILD_NUMBER}"

      # 3) 打包并上传到 Artifactory，同时记入 Build Info
      - name: Publish package to Artifactory
        run: |
          jf npm publish \
            --build-name="${JFROG_CLI_BUILD_NAME}" \
            --build-number="${JFROG_CLI_BUILD_NUMBER}"

      # 4) 搜集并发布 Build Info（环境变量 + Git VCS + 发布到 Artifactory）
      - name: Collect and publish build info
        run: |
          jf rt build-collect-env \
            "${JFROG_CLI_BUILD_NAME}" "${JFROG_CLI_BUILD_NUMBER}"
          jf rt build-add-git \
            "${JFROG_CLI_BUILD_NAME}" "${JFROG_CLI_BUILD_NUMBER}"
          jf rt build-publish \
            "${JFROG_CLI_BUILD_NAME}" "${JFROG_CLI_BUILD_NUMBER}"

      # 5) 使用 Xray 扫描已发布的 Build（有漏洞也不阻断流水线）
      - name: Scan build with Xray
        run: |
          jf build-scan \
            "${JFROG_CLI_BUILD_NAME}" "${JFROG_CLI_BUILD_NUMBER}" \
            --fail=false
